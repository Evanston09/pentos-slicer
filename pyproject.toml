[project]
name = "slicer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.1",
    "rtree>=1.4.1",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "tetgen>=0.8.4",
    "triangle>=20250106",
    "trimesh[recommend]>=4.12.2",
    "viser @ git+https://github.com/Evanston09/viser.git@local-storage",
]

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pre-commit>=4.6.0",
    "pytest>=8.4.2",
    "ruff>=0.15.18",
    "watchfiles>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff.lint.per-file-ignores]
# Path bootstrap must run before imports when modules are used as scripts.
"visualizations/*.py" = ["E402"]
"visualizations/blender/*.py" = ["E402"]
"tests/test_visualization_pipeline.py" = ["E402"]
